<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Toplantı Asistanı</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <span class="logo">🎙️</span>
    <div>
      <div class="title">Toplantı Asistanı</div>
      <div class="subtitle">Türkçe gerçek zamanlı transkripsiyon</div>
    </div>
  </div>

  <div class="section">
    <label>Sunucu Adresi</label>
    <input type="text" id="server-url" placeholder="ws://localhost:5000/ws/live" />
    <div class="hint">Python sunucusunun WebSocket adresi</div>
  </div>

  <div class="section">
    <label>Varsayılan Model</label>
    <select id="model">
      <option value="tiny">tiny — En hızlı</option>
      <option value="base" selected>base — Dengeli</option>
      <option value="small">small — Yüksek doğruluk</option>
      <option value="medium">medium — Çok yüksek</option>
      <option value="large">large — En yüksek</option>
    </select>
  </div>

  <div class="actions">
    <button id="btn-save" class="btn-primary">Kaydet</button>
    <button id="btn-open-live" class="btn-secondary">Web Arayüzü Aç ↗</button>
  </div>

  <div id="status-msg" class="status-msg hidden"></div>

  <div class="footer">
    Google Meet'te sidebar otomatik görünür.<br/>
    Mikrofon izni istenebilir.
  </div>

  <script src="popup.js"></script>
</body>
</html>
